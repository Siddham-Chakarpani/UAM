spring.application.name=uam-backend

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ── SQLite DataSource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:./uam.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=uam-super-secret-key-at-least-256-bits-long-for-hs256-algorithm-security
jwt.expiration=86400000

# ── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.uam=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── SpringDoc / Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# ── Spring Boot Actuator ──────────────────────────────────────────────────────
# Expose health + info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SQLite doesn't support the standard JDBC validation query used by the
# actuator DB health check → disable it and rely on our own /health endpoint
management.health.db.enabled=false
management.health.defaults.enabled=true

# Application info shown at /actuator/info
info.app.name=UAM System
info.app.description=User Access Management and Audit Logging System
info.app.version=1.0.0
info.app.frontend=http://localhost:5173
info.app.swagger=http://localhost:8080/swagger-ui.html
